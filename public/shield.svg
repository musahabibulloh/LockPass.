<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Outer Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#glow)" />
  
  <!-- Background circle representing lock container -->
  <circle cx="256" cy="256" r="200" fill="#131c31" stroke="rgba(255, 255, 255, 0.08)" stroke-width="6" />
  
  <!-- Shield Graphic -->
  <path d="M256,90 C340,90 380,120 380,120 C380,120 380,280 340,360 C300,440 256,470 256,470 C256,470 212,440 172,360 C132,280 132,120 132,120 C132,120 172,90 256,90 Z" 
        fill="#080d1a" 
        stroke="url(#shieldGrad)" 
        stroke-width="12" 
        stroke-linejoin="round" />
        
  <!-- Glowing Inner Keyhole or Lock Icon -->
  <g transform="translate(216, 200)" fill="url(#shieldGrad)">
    <!-- Lock Shackle -->
    <path d="M40,25 C40,11 29,0 15,0 C1,0 -10,11 -10,25 L-10,40 L40,40 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="10" transform="translate(25, 0)" />
    <!-- Lock Body -->
    <rect x="0" y="35" width="80" height="60" rx="10" />
    <!-- Keyhole -->
    <circle cx="40" cy="58" r="8" fill="#080d1a" />
    <polygon points="36,58 44,58 46,78 34,78" fill="#080d1a" />
  </g>
</svg>
